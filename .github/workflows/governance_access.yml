name: Governance access-as-code

# Access-as-code PR workflow. An access request is a PR touching only governance/access_matrix.json + members/*.csv.

on:
  pull_request:
    paths:
      - "governance/**"
  push:
    branches: [main]
    paths:
      - "governance/**"

permissions:
  contents: read
  pull-requests: write # pr job posts the sticky access-diff comment

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Terraform fmt / validate (no backend, no state)
        working-directory: governance
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Lint access config
        working-directory: governance
        run: python scripts/lint_access_config.py

      - name: Render access diff
        working-directory: governance
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          mkdir -p /tmp/base/members
          git show "$BASE_SHA:governance/access_matrix.json" > /tmp/base/access_matrix.json 2>/dev/null \
            || echo '{"teams":{}}' > /tmp/base/access_matrix.json
          for path in $(git ls-tree -r --name-only "$BASE_SHA" -- governance/members | grep '\.csv$'); do
            git show "$BASE_SHA:$path" > "/tmp/base/members/$(basename "$path")" 2>/dev/null || true
          done
          python scripts/render_access_diff.py \
            --base-matrix /tmp/base/access_matrix.json --head-matrix access_matrix.json \
            --base-members-dir /tmp/base/members --head-members-dir members > /tmp/access_diff.md
          cat /tmp/access_diff.md

      - name: Post sticky access-diff comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- governance-access-diff -->';
            const body = `${marker}\n## Access change preview\n\n` + fs.readFileSync('/tmp/access_diff.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: governance-prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Terraform init (S3 backend from repo variables — never a committed backend.hcl)
        working-directory: governance
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=governance/terraform.tfstate" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        working-directory: governance
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
