# Databricks Asset Bundle for declarative_bronze.
bundle:
  name: declarative_bronze

include:
  - resources/*.yml

# NOTE: workspace.host must be a literal — the Databricks CLI rejects ${var.*}
# interpolation for auth-configuring fields. The URL is non-secret; deploy to a
# different workspace by editing it here (or add a target). Auth itself comes
# from the DATABRICKS_HOST/DATABRICKS_TOKEN env vars (or a profile).
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-97f240ad-c636.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-97f240ad-c636.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
