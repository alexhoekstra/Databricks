# Databricks Asset Bundle for declarative_curated (silver + future gold).
# HAND-AUTHORED & COMMITTED — unlike ../bundle, nothing here is generated by
# Terraform. Users edit this bundle directly; CI redeploys on merge.
bundle:
  name: declarative_curated

include:
  - resources/*.yml

variables:
  bronze_pipeline_id:
    description: >-
      ID of the bronze ingestion pipeline (deployed from ../bundle), used by the
      declarative_medallion job's bronze_update task. NOTE: in the dev target,
      development mode name-prefixes the bronze pipeline, so this name lookup
      fails — deploy dev with an explicit override:
      `databricks bundle deploy -t dev --var="bronze_pipeline_id=<id>"`.
      The prod target (unprefixed names) resolves automatically.
    lookup:
      pipeline: declarative_bronze

  bronze_source:
    description: >-
      catalog.schema the silver pipeline reads bronze tables from. The default
      targets the prod (unprefixed) bronze schema — the cross-project contract
      that ../../data_quality depends on. In the dev target the bronze schema is
      name-prefixed, so override to match, e.g.
      `--var="bronze_source=main.dev_<you>_declarative_bronze"`.
    default: main.declarative_bronze

# NOTE: workspace.host must be a literal — the Databricks CLI rejects ${var.*}
# interpolation for auth-configuring fields. Auth comes from the DATABRICKS_HOST/
# DATABRICKS_TOKEN env vars (or a profile).
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-97f240ad-c636.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-97f240ad-c636.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
