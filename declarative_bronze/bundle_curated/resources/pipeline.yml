# HAND-AUTHORED curated resources for declarative_curated. Committed and edited
# directly (NOT generated by Terraform, NOT gitignored).
#
# Add a silver table = add ONE JSON entry under declarative_curated.tables below
# and merge; CI redeploys the bundle. Verify column names against the bronze data
# first — do not guess.
resources:
  schemas:
    declarative_silver_schema:
      catalog_name: main
      name: declarative_silver
      comment: "Silver curation layer (SCD2 + quarantine) for declarative_bronze."

    declarative_gold_schema:
      catalog_name: main
      name: declarative_gold
      comment: "Gold aggregate layer over declarative_silver."

  pipelines:
    declarative_curated:
      name: declarative_curated
      serverless: true
      # Curation is ALWAYS triggered, never continuous: the declarative_medallion
      # job sequences bronze -> silver, and Free Edition permits only one active
      # pipeline update at a time.
      continuous: false
      catalog: main
      schema: ${resources.schemas.declarative_silver_schema.name}
      libraries:
        - notebook:
            path: ../src/transform_silver.py
        # Gold aggregates join THIS pipeline (no third pipeline allowed on Free
        # Edition). They run after silver in the same update.
        - notebook:
            path: ../src/transform_gold.py
      configuration:
        declarative_curated.source: ${var.bronze_source}
        # Gold reads silver-current snapshots from silver_source and publishes
        # aggregates cross-schema to gold_target. Both resolve to the dev-prefixed
        # schema names in the dev target (gold stays dev-isolated) and the bare
        # main.declarative_{silver,gold} names in prod — the published contract.
        declarative_curated.silver_source: main.${resources.schemas.declarative_silver_schema.name}
        declarative_curated.gold_target: main.${resources.schemas.declarative_gold_schema.name}
        # Silver tables are configured HERE — one JSON entry per table. The block
        # scalar keeps the JSON readable. Keys: primary_keys (required),
        # sequence_by (required), expectations (optional {name: SQL condition}).
        declarative_curated.tables: |
          {
            "programs": {
              "primary_keys": ["program_id"],
              "sequence_by": "_ingest_ts",
              "expectations": {
                "pk_not_null": "program_id IS NOT NULL",
                "valid_start_fy": "start_fy IS NOT NULL AND start_fy BETWEEN 1950 AND 2100"
              }
            },
            "contracts": {
              "primary_keys": ["contract_id"],
              "sequence_by": "_ingest_ts",
              "expectations": {
                "pk_not_null": "contract_id IS NOT NULL",
                "fk_program_not_null": "program_id IS NOT NULL",
                "fk_vendor_not_null": "vendor_id IS NOT NULL",
                "positive_award": "award_amount > 0"
              }
            },
            "obligations": {
              "primary_keys": ["obligation_id"],
              "sequence_by": "_ingest_ts",
              "expectations": {
                "pk_not_null": "obligation_id IS NOT NULL",
                "fk_contract_not_null": "contract_id IS NOT NULL",
                "positive_amount": "amount > 0",
                "valid_fiscal_year": "fiscal_year BETWEEN 2000 AND 2100"
              }
            },
            "vendors": {
              "primary_keys": ["vendor_id"],
              "sequence_by": "_ingest_ts",
              "expectations": {
                "pk_not_null": "vendor_id IS NOT NULL",
                "name_not_null": "vendor_name IS NOT NULL"
              }
            }
          }
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure

  jobs:
    declarative_medallion:
      name: declarative_medallion
      # Sequences the two pipelines. Free Edition allows both to be defined but
      # only one update active at a time, so they must never run concurrently.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tasks:
        - task_key: bronze_update
          pipeline_task:
            pipeline_id: ${var.bronze_pipeline_id}
        - task_key: silver_update
          depends_on:
            - task_key: bronze_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.declarative_curated.id}
