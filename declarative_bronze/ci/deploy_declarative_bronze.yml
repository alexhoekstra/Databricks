# GitHub Actions workflow for declarative_bronze.
name: deploy-declarative-bronze

on:
  push:
    branches: [main]
    paths: ["declarative_bronze/**"]
  pull_request:
    paths: ["declarative_bronze/**"]
  workflow_dispatch: # manual "Run workflow" button

# Serialize runs so two deploys can't overlap (never cancel an in-flight deploy).
concurrency:
  group: deploy-declarative-bronze
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  # Pin the Databricks CLI for reproducible CI (bump deliberately). Matches the
  # version validated locally against these bundles.
  DATABRICKS_CLI_VERSION: "1.4.0"

jobs:
  # ===========================================================================
  # PR gate — static, no secrets, no cloud.
  # ===========================================================================
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # `databricks bundle validate -t dev` resolves current_user (development
      # mode), so it needs auth. Same-repo branch PRs get these secrets; the
      # terraform + ruff steps below run fine without them (fork PRs).
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt (declarative_bronze)
        working-directory: declarative_bronze/ingestion
        run: terraform fmt -check -recursive ..

      - name: Terraform validate (ingestion)
        working-directory: declarative_bronze/ingestion
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Render pipeline.gen.yml from the example config
        working-directory: declarative_bronze/ingestion
        run: |
          cp terraform.tfvars.example terraform.tfvars
          # Regenerate ONLY the resource file — no cloud, no auth (see header).
          terraform apply -auto-approve -input=false -target=local_file.pipeline
          test -f ../bundle/resources/pipeline.gen.yml
          echo "----- generated pipeline.gen.yml -----"
          cat ../bundle/resources/pipeline.gen.yml

      - name: Assert the generated resource file is gitignored
        run: git check-ignore declarative_bronze/bundle/resources/pipeline.gen.yml

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh -s -- --version "$DATABRICKS_CLI_VERSION"

      - name: Databricks bundle validate (bronze)
        working-directory: declarative_bronze/bundle
        run: databricks bundle validate -t dev

      - name: Databricks bundle validate (curated)
        working-directory: declarative_bronze/bundle_curated
        # bronze_pipeline_id is a lookup resolved at deploy time; override with a
        # placeholder so structural validation doesn't require the pipeline to exist.
        run: databricks bundle validate -t dev --var="bronze_pipeline_id=0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Lint the DLT sources (ruff)
        run: |
          pip install ruff
          ruff check declarative_bronze/bundle/src/ declarative_bronze/bundle_curated/src/

  # ===========================================================================
  # Deploy — on merge to main (or manual dispatch). Regenerates the resource
  # file from the REAL config (secret tfvars), then deploys BOTH bundles to prod
  # (bronze first so the curated bundle's pipeline lookup resolves).
  #
  # NOTE: Terraform state is local, so CI does NOT `terraform apply` the UC
  # resources — it only regenerates the bronze resource file and deploys bundles.
  # The curated bundle is fully hand-authored: no Terraform step touches it.
  # ===========================================================================
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Materialize terraform.tfvars from secret
        working-directory: declarative_bronze/ingestion
        env:
          TFVARS: ${{ secrets.DECLARATIVE_BRONZE_TFVARS }}
        run: |
          if [ -z "$TFVARS" ]; then
            echo "::error::Secret DECLARATIVE_BRONZE_TFVARS is not set. Add the prod" \
                 "sources config (same shape as terraform.tfvars.example) as a repo secret."
            exit 1
          fi
          printf '%s' "$TFVARS" > terraform.tfvars

      - name: Regenerate pipeline.gen.yml from prod config
        working-directory: declarative_bronze/ingestion
        run: |
          terraform init -backend=false -input=false
          terraform apply -auto-approve -input=false -target=local_file.pipeline
          test -f ../bundle/resources/pipeline.gen.yml

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh -s -- --version "$DATABRICKS_CLI_VERSION"

      - name: Deploy bronze bundle (prod)
        working-directory: declarative_bronze/bundle
        run: databricks bundle deploy --target prod

      - name: Deploy curated bundle (prod)
        working-directory: declarative_bronze/bundle_curated
        run: databricks bundle deploy --target prod
